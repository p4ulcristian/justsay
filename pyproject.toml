# Tool settings only. iris-dictation is installed with install.sh, not pip.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_learn.py" = ["E501"]   # real journal lines
